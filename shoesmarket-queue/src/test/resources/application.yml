spring:
  datasource:
    url: jdbc:h2:mem:queuedb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

shoesmarket:
  queue:
    admit-per-second: 100
    token-ttl-seconds: 300
