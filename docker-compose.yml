services:
  mysql:
    image: mysql:8.4
    container_name: shoesmarket-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shoesmarket
      MYSQL_USER: shoesmarket
      MYSQL_PASSWORD: shoesmarket
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - shoesmarket-mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4
    container_name: shoesmarket-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shoesmarket-mysql-data:
