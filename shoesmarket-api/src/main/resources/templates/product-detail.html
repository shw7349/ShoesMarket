<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('상품 상세 · ShoesMarket')}"></head>
<body>
<nav th:replace="~{fragments :: header}"></nav>

<main class="container">
    <section class="detail">
        <div class="visual">👟</div>
        <div>
            <div class="brand-tag" th:text="${product.brand}">BRAND</div>
            <h1 th:text="${product.name}">상품명</h1>
            <div class="price" style="font-size:1.4rem" th:text="'₩' + ${#numbers.formatInteger(product.price, 0, 'COMMA')}">₩0</div>
            <p class="muted" style="margin-top:16px">한정 수량으로 진행되는 드롭 이벤트에서만 구매할 수 있습니다.</p>
        </div>
    </section>

    <h2 class="section-title">드롭 일정</h2>
    <div class="list">
        <a class="row" th:each="d : ${drops}" th:href="@{/drops/{id}(id=${d.id})}">
            <div>
                <div style="font-weight:700">드롭 #<span th:text="${d.id}">1</span></div>
                <div class="muted" style="font-size:0.88rem">
                    오픈 <span th:text="${#temporals.format(d.openAt, 'yyyy-MM-dd HH:mm')}">-</span>
                    · 총 <span th:text="${d.totalStock}">0</span>개 · 1인 <span th:text="${d.perUserLimit}">1</span>개
                </div>
            </div>
            <span class="badge" th:classappend="${#strings.toLowerCase(d.status)}" th:text="${d.status}">OPEN</span>
        </a>
        <div th:if="${drops.isEmpty()}" class="empty">예정된 드롭이 없습니다.</div>
    </div>

    <h2 class="section-title">후기
        <span class="muted" id="reviewSummary" style="font-size:0.95rem; font-weight:500"></span>
    </h2>

    <div id="reviewWrite" class="queue-box" style="display:none; margin-bottom:16px">
        <div class="field">
            <label>평점</label>
            <select id="ratingInput" class="btn" style="width:auto">
                <option value="5">★★★★★ (5)</option>
                <option value="4">★★★★☆ (4)</option>
                <option value="3">★★★☆☆ (3)</option>
                <option value="2">★★☆☆☆ (2)</option>
                <option value="1">★☆☆☆☆ (1)</option>
            </select>
        </div>
        <div class="field">
            <label>내용</label>
            <input type="text" id="contentInput" placeholder="상품은 어떠셨나요?"/>
        </div>
        <div class="field">
            <label>사진 (선택)</label>
            <label class="file-upload">
                <input type="file" id="imageInput" accept="image/*" hidden/>
                <span class="file-btn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="m21 15-5-5L5 21"/>
                    </svg>
                    사진 선택
                </span>
                <span class="file-name" id="fileName">선택된 파일 없음</span>
            </label>
        </div>
        <button class="btn btn-primary" id="submitReview">후기 등록</button>
        <div id="reviewError" class="error" style="margin-top:10px"></div>
    </div>
    <p id="reviewLoginHint" class="muted" style="display:none">후기는 구매한 회원만 작성할 수 있습니다. <a href="/login">로그인</a></p>

    <div class="list" id="reviewList"></div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
<div th:replace="~{fragments :: toast}"></div>

<script th:inline="javascript">
  const productId = [[${product.id}]];
  const memberId = [[${loginMember != null ? loginMember.id : null}]];
  const $ = (id) => document.getElementById(id);
  const stars = (n) => '★★★★★☆☆☆☆☆'.slice(5 - n, 10 - n);

  async function loadReviews() {
    const res = await fetch(`/api/v1/products/${productId}/reviews?sort=LATEST`);
    const body = await res.json();
    const d = body.data;
    $('reviewSummary').textContent = d.count > 0
      ? `★ ${d.average.toFixed(1)} · ${d.count}개` : '· 아직 후기가 없습니다';
    const list = $('reviewList');
    list.innerHTML = '';
    d.reviews.forEach((r) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.style.alignItems = 'flex-start';
      row.innerHTML = `<div style="flex:1">
        <div style="font-weight:700">${stars(r.rating)} <span class="muted" style="font-weight:500">${r.authorName}</span></div>
        <div style="margin:4px 0">${escapeHtml(r.content)}</div>
        ${r.imageUrl ? `<img src="${r.imageUrl}" alt="후기 이미지" style="max-width:160px; border-radius:10px; margin-top:6px"/>` : ''}
      </div>`;
      list.appendChild(row);
    });
    if (d.reviews.length === 0) list.innerHTML = '<div class="empty">첫 후기를 남겨보세요.</div>';
  }

  function escapeHtml(s) { const e = document.createElement('div'); e.textContent = s; return e.innerHTML; }

  async function submitReview() {
    $('reviewError').textContent = '';
    let imageUrl = null;
    const file = $('imageInput').files[0];
    if (file) {
      const fd = new FormData(); fd.append('file', file);
      const up = await fetch('/api/v1/uploads', { method: 'POST', body: fd });
      const upBody = await up.json();
      if (upBody.success) imageUrl = upBody.data.url;
    }
    const res = await fetch(`/api/v1/products/${productId}/reviews`, {
      method: 'POST',
      headers: { 'X-User-Id': String(memberId), 'Content-Type': 'application/json' },
      body: JSON.stringify({ rating: Number($('ratingInput').value), content: $('contentInput').value, imageUrl }),
    });
    const body = await res.json();
    if (body.success) {
      $('contentInput').value = ''; $('imageInput').value = '';
      loadReviews();
    } else {
      $('reviewError').textContent = body.error ? body.error.message : '등록 실패';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    if (memberId !== null) $('reviewWrite').style.display = 'block';
    else $('reviewLoginHint').style.display = 'block';
    const b = $('submitReview'); if (b) b.addEventListener('click', submitReview);
    const img = $('imageInput');
    if (img) img.addEventListener('change', () => {
      $('fileName').textContent = img.files.length ? img.files[0].name : '선택된 파일 없음';
    });
    loadReviews();
  });
</script>
</body>
</html>
