<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('드롭 · ShoesMarket')}"></head>
<body>
<nav th:replace="~{fragments :: header}"></nav>

<main class="container">
    <section class="detail">
        <div class="visual">🔥</div>
        <div>
            <div class="brand-tag" th:if="${product}" th:text="${product.brand}">BRAND</div>
            <h1 th:text="${product != null} ? ${product.name} : ('드롭 #' + ${drop.id})">드롭</h1>
            <span class="badge" th:classappend="${#strings.toLowerCase(drop.status)}" th:text="${drop.status}">OPEN</span>
            <div class="price" style="font-size:1.3rem; margin-top:12px"
                 th:if="${product}" th:text="'₩' + ${#numbers.formatInteger(product.price, 0, 'COMMA')}">₩0</div>

            <div class="queue-box">
                <div id="preopen" style="display:none">
                    <div class="muted">오픈까지</div>
                    <div class="countdown" id="countdown">--:--:--</div>
                </div>
                <div id="participate" style="display:none">
                    <button class="btn btn-primary btn-block" id="enterBtn">대기열 참여</button>
                </div>
                <div id="waiting" style="display:none">
                    <div class="muted">내 순번</div>
                    <div class="rank-badge"><span id="rank">-</span></div>
                    <div class="status-line">차례가 오면 자동으로 선점 단계로 넘어갑니다.</div>
                </div>
                <div id="admitted" style="display:none">
                    <div class="status-line" style="color:var(--ok)">입장했습니다. 지금 선점하세요!</div>
                    <button class="btn btn-primary btn-block" id="reserveBtn" style="margin-top:10px">재고 선점</button>
                </div>
                <div id="result" class="status-line" style="margin-top:10px"></div>
                <div id="needLogin" style="display:none">
                    <p class="muted">참여하려면 로그인이 필요합니다.</p>
                    <a class="btn btn-primary btn-block" href="/login">로그인</a>
                </div>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
<div th:replace="~{fragments :: toast}"></div>

<script th:inline="javascript">
  const dropId = [[${drop.id}]];
  const openAtMs = [[${drop.openAt.toEpochMilli()}]];
  const status = [[${drop.status.name()}]];
  const memberId = [[${loginMember != null ? loginMember.id : null}]];

  const $ = (id) => document.getElementById(id);
  const show = (id) => { $(id).style.display = 'block'; };
  const hideAll = () => ['preopen','participate','waiting','admitted','needLogin'].forEach(i => $(i).style.display = 'none');

  function headers() { return { 'X-User-Id': String(memberId), 'Content-Type': 'application/json' }; }

  function render() {
    hideAll();
    if (status !== 'OPEN') { show('preopen'); startCountdown(); return; }
    if (memberId === null) { show('needLogin'); return; }
    show('participate');
  }

  function startCountdown() {
    const tick = () => {
      const diff = Math.max(0, openAtMs - Date.now());
      const s = Math.floor(diff / 1000);
      const hh = String(Math.floor(s / 3600)).padStart(2, '0');
      const mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
      const ss = String(s % 60).padStart(2, '0');
      $('countdown').textContent = `${hh}:${mm}:${ss}`;
    };
    tick();
    setInterval(tick, 1000);
  }

  async function enter() {
    await fetch(`/api/v1/drops/${dropId}/queue`, { method: 'POST', headers: headers() });
    hideAll(); show('waiting');
    poll();
  }

  async function poll() {
    try {
      const res = await fetch(`/api/v1/drops/${dropId}/queue/me`, { headers: headers() });
      const body = await res.json();
      const data = body.data || {};
      if (data.status === 'ADMITTED') { hideAll(); show('admitted'); return; }
      if (data.rank != null) $('rank').textContent = data.rank;
    } catch (e) { /* ignore */ }
    setTimeout(poll, 2000);
  }

  async function reserve() {
    const res = await fetch(`/api/v1/drops/${dropId}/reservations`, { method: 'POST', headers: headers() });
    const body = await res.json();
    if (body.success) {
      $('result').style.color = 'var(--ok)';
      $('result').textContent = '선점 성공! 결제 단계로 진행하세요. (예약 #' + body.data.reservationId + ')';
    } else {
      $('result').style.color = 'var(--danger)';
      $('result').textContent = '선점 실패: ' + (body.error ? body.error.message : '알 수 없음');
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    render();
    const e = $('enterBtn'); if (e) e.addEventListener('click', enter);
    const r = $('reserveBtn'); if (r) r.addEventListener('click', reserve);
  });
</script>
</body>
</html>
