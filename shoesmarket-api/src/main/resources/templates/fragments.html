<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="/css/app.css"/>
    <title th:text="${title}">ShoesMarket</title>
</head>
<body>
<nav class="nav" th:fragment="header">
    <div class="container nav-inner">
        <a class="brand" href="/">SHOESMARKET</a>
        <form class="search" method="get" action="/" role="search">
            <svg class="search-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/>
            </svg>
            <input type="text" name="q" th:value="${q}" placeholder="브랜드, 상품 검색" aria-label="검색"/>
        </form>
        <div class="nav-links">
            <a href="/">상품</a>
            <span th:if="${loginMember}" class="nav-links" style="gap:16px">
                <a href="/mypage">마이페이지</a>
                <span class="me" th:text="${loginMember.displayName}">회원</span>
                <form method="post" action="/logout" style="display:inline">
                    <button class="btn btn-ghost" type="submit">로그아웃</button>
                </form>
            </span>
            <span th:unless="${loginMember}" class="nav-links" style="gap:16px">
                <a href="/login">로그인</a>
                <a href="/signup">회원가입</a>
            </span>
        </div>
    </div>
</nav>

<div th:fragment="toast" th:if="${toast}" class="toast" th:text="${toast}" id="toast">알림</div>

<footer th:fragment="footer">
    <div class="container" style="padding:40px 20px; color:var(--muted); font-size:0.85rem; border-top:1px solid var(--border);">
        선착순 한정판 스니커즈 드롭 데모 · ShoesMarket
    </div>
    <script>
        const t = document.getElementById('toast');
        if (t) setTimeout(() => t.remove(), 2600);
    </script>
</footer>
</body>
</html>
